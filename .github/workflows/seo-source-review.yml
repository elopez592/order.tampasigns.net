name: SEO conversion source review
on:
  push:
    branches: [seo-conversions-20260924]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: conversion-source
          path: |
            app/
            tests/
            scripts/
            requirements*.txt
            pyproject.toml
            package.json
            Dockerfile
          retention-days: 1
