name: Verify first-party conversion dashboard
on:
  push:
    branches: [seo-conversions-20260924, verify-marketing-live-20260924]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name == 'verify-marketing-live-20260924' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded integration
        if: github.ref_name == 'seo-conversions-20260924'
        run: python scripts/apply_marketing.py
      - name: Validate modules
        run: |
          node --check app/static/app.js
          node --check app/static/shop.js
          node --check app/static/measure.js
          node --check app/static/marketing-admin.js
          python -m compileall -q app
      - name: Install tests
        run: |
          pip install -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: Verify permissions, attribution, real conversions and payment accounting
        if: github.ref_name == 'seo-conversions-20260924'
        run: python -m pytest -q tests/test_marketing.py tests/test_pricing_security.py tests/test_checkout_privacy.py
      - name: Verify owner dashboard and visitor consent locally
        if: github.ref_name == 'seo-conversions-20260924'
        env:
          DATA_DIR: /tmp/marketing-verification
          PUBLIC_URL: http://localhost:8000
          APP_ENV: development
          DEMO_SEED: '0'
          ADMIN_EMAIL: owner@example.test
          ADMIN_PASSWORD: OwnerTestPassword-OnlyForTests2026
        run: |
          python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/marketing-app.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break || sleep 1; done
          python scripts/verify_marketing_browser.py
      - name: Verify live public pages without generating false conversion data
        if: github.ref_name == 'verify-marketing-live-20260924'
        env:
          VERIFY_BASE_URL: https://orders.tampasigns.net
        run: python scripts/verify_marketing_browser.py
      - name: Save code and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-verified
          path: |
            marketing-*.png
            app/marketing.py
            app/main.py
            app/static/measure.js
            app/static/measure.css
            app/static/marketing-admin.js
            app/static/app.js
            app/static/index.html
            app/static/shop.js
            app/static/window-upload.js
            tests/test_marketing.py
          retention-days: 7
      - name: Commit tested integration on feature branch
        if: github.ref_name == 'seo-conversions-20260924'
        run: |
          git add app
          git config user.name 'Tampa website maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate tested owner conversion dashboard and opt-in cross-site measurement'
          git push origin HEAD:seo-conversions-20260924
