name: Verify tinting without design prompts
on:
  push:
    branches: [tint-no-design-20260924, verify-tint-no-design-live-20260924]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'verify-tint-no-design-live-20260924' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply tint-only presentation changes
        if: github.ref_name == 'tint-no-design-20260924'
        run: python scripts/apply_tint_no_design.py
      - name: Verify syntax and existing upload lifecycles
        run: |
          node --check app/static/app.js
          node --check app/static/shop.js
          node tests/window_upload.test.mjs
          node tests/wrap_upload.test.mjs
      - name: Install browser verification tools
        run: |
          pip install -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: Check catalog, pricing and upload regressions
        if: github.ref_name == 'tint-no-design-20260924'
        run: python -m pytest -q tests/test_transfer_windows_wholesale.py tests/test_wrap_artwork_catalog.py tests/test_window_upload_js.py tests/test_wrap_upload_js.py
      - name: Verify tint-only and mixed projects locally
        if: github.ref_name == 'tint-no-design-20260924'
        env:
          DATA_DIR: /tmp/tint-no-design-verification
          PUBLIC_URL: http://localhost:8000
          APP_ENV: development
          DEMO_SEED: '0'
        run: |
          python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/tint-app.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break || sleep 1; done
          python scripts/verify_tint_no_design.py
      - name: Verify live tinting without submitting orders
        if: github.ref_name == 'verify-tint-no-design-live-20260924'
        env:
          VERIFY_BASE_URL: https://orders.tampasigns.net
        run: python scripts/verify_tint_no_design.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tint-no-design-browser
          path: tint-no-design-*.png
          if-no-files-found: ignore
      - name: Commit verified application changes
        if: github.ref_name == 'tint-no-design-20260924'
        run: |
          git add app/static/app.js app/static/index.html
          git config user.name 'Tinting interface maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove design prompts from window tinting product pages and checkout'
          git push origin HEAD:tint-no-design-20260924
