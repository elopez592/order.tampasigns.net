name: Apply and verify window artwork upload
on:
  push:
    branches: [window-artwork-upload-20260924]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: /tmp/window-upload-verification
      PUBLIC_URL: http://localhost:8000
      APP_ENV: development
      DEMO_SEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: window-artwork-upload-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded integration
        run: python scripts/apply_window_upload.py
      - name: Verify JavaScript and artwork lifecycle
        run: |
          node --check app/static/app.js
          node --check app/static/shop.js
          node --check app/static/window-upload.js
          node tests/window_upload.test.mjs
      - name: Verify no regressions against production baseline
        run: |
          pip install -r requirements-dev.txt
          python -m compileall -q app
          current_status=0
          pytest -q --junitxml="$RUNNER_TEMP/window-current.xml" || current_status=$?
          if [ "$current_status" -gt 1 ]; then exit "$current_status"; fi
          git fetch --no-tags --depth=1 origin 07c49611c724979c613f3900d697a882b5c71ad5
          git worktree add --detach "$RUNNER_TEMP/window-upload-baseline" 07c49611c724979c613f3900d697a882b5c71ad5
          baseline_status=0
          (cd "$RUNNER_TEMP/window-upload-baseline" && pytest -q tests/test_owner_reports_contour.py::test_frontend_exposes_reports_contour_proofs_and_product_icons tests/test_storefront_categories_magnets_usdot.py::test_decals_usdot_and_apparel_listings tests/test_storefront_expansion.py::test_wholesale_discount_does_not_reduce_digitizing_fee --junitxml="$RUNNER_TEMP/window-baseline.xml") || baseline_status=$?
          if [ "$baseline_status" -gt 1 ]; then exit "$baseline_status"; fi
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def failures(name):
              return {(case.get('classname'),case.get('name')) for case in ET.parse(root/name).iter('testcase') if case.find('failure') is not None or case.find('error') is not None}
          current, baseline = failures('window-current.xml'), failures('window-baseline.xml')
          assert current <= baseline, f'New regressions: {current - baseline}'
          assert len(baseline) <= 3, baseline
          print(f'PASS: No new regression failures. {len(current)} existing unrelated failures reproduced on unchanged production source.')
          for failure in sorted(current): print('Existing baseline failure:', '::'.join(failure))
          PY
      - name: Verify browser upload through private order attachment
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/window-upload-app.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break || sleep 1; done
          python scripts/verify_window_upload_browser.py
      - name: Save visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-upload-browser-verification
          path: window-upload-*.png
          if-no-files-found: ignore
      - name: Commit verified source
        run: |
          git add app/static/shop.js app/static/app.js app/static/index.html
          git config user.name 'Window upload maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Enable window design uploads on product pages, cart and order submission'
          git push origin HEAD:window-artwork-upload-20260924
