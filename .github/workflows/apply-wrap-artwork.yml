name: Verify vehicle and trailer artwork choices
on:
  push:
    branches: [wrap-artwork-options-20260924]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: /tmp/wrap-upload-verification
      PUBLIC_URL: http://localhost:8000
      APP_ENV: development
      DEMO_SEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply frontend-only wrap artwork changes
        run: python scripts/apply_wrap_artwork.py
      - name: Verify JavaScript and both upload lifecycles
        run: |
          node --check app/static/app.js
          node --check app/static/shop.js
          node --check app/static/window-upload.js
          node tests/window_upload.test.mjs
          node tests/wrap_upload.test.mjs
      - name: Compare application regressions with unchanged release
        run: |
          pip install -r requirements-dev.txt
          python -m compileall -q app
          python scripts/verify_wrap_regressions.py
      - name: Verify desktop and mobile uploads through isolated order submission
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/wrap-upload-app.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break || sleep 1; done
          python scripts/verify_wrap_upload_browser.py
          python scripts/verify_window_upload_browser.py
      - name: Save browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrap-artwork-verification
          path: |
            wrap-upload-*.png
            window-upload-*.png
          if-no-files-found: ignore
      - name: Commit only verified application changes
        run: |
          git add app/static/shop.js app/static/window-upload.js app/static/app.js app/static/index.html
          git config user.name 'Artwork options maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use Upload Design and Request design help for vehicle and trailer wraps'
          git push origin HEAD:wrap-artwork-options-20260924
